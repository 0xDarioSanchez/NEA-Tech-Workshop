<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Construir en Stellar · NEA Tech</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #060811;
    --bg-panel: #0d1120;
    --bg-panel-2: #121729;
    --line: #232a44;
    --ink: #edf1fb;
    --ink-dim: #97a1c2;
    --ink-faint: #5c6588;
    --cyan: #2fe6c9;
    --cyan-dim: #17a893;
    --magenta: #ff5fd0;
    --gold: #ffcf6e;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    overflow: hidden;
  }

  body {
    font-family: "Manrope", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, .mono {
    font-family: "Space Mono", ui-monospace, "SF Mono", monospace;
  }

  .deck {
    position: relative;
    width: 100%;
    height: 100dvh;
    background:
      radial-gradient(circle at 14% 18%, rgba(47,230,201,0.10), transparent 42%),
      radial-gradient(circle at 88% 82%, rgba(255,95,208,0.09), transparent 46%),
      var(--bg);
  }

  .railtrack {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: var(--line);
    z-index: 5;
  }
  .rail {
    height: 100%;
    background: linear-gradient(90deg, var(--magenta), var(--cyan) 45%, var(--gold) 80%, var(--magenta));
    background-size: 220% 100%;
    animation: railmove 7s linear infinite;
    width: 0%;
    transition: width .4s ease;
  }
  @keyframes railmove { from { background-position: 0 0; } to { background-position: -220% 0; } }

  .slide {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    justify-content: center;
    padding: 7vh 9vw 9vh;
  }
  .slide.active { display: flex; }

  .eyebrow {
    font-family: "Space Mono", monospace;
    text-transform: uppercase;
    letter-spacing: .16em;
    font-size: clamp(.7rem, 1vw, .85rem);
    color: var(--cyan);
    margin: 0 0 1.4rem;
  }
  .eyebrow.magenta { color: var(--magenta); }
  .eyebrow.gold { color: var(--gold); }

  h1.title {
    font-size: clamp(2.2rem, 5.2vw, 4.4rem);
    line-height: 1.05;
    margin: 0 0 1.1rem;
    text-wrap: balance;
    font-weight: 700;
  }
  h2.title { font-size: clamp(1.7rem, 3.6vw, 3rem); line-height: 1.1; margin: 0 0 1rem; text-wrap: balance; font-weight: 700; }

  p.lede {
    font-size: clamp(1.05rem, 1.7vw, 1.5rem);
    line-height: 1.55;
    color: var(--ink-dim);
    max-width: 46ch;
    margin: 0;
  }

  .accent { color: var(--cyan); }
  .accent-m { color: var(--magenta); }
  .accent-g { color: var(--gold); }

  .brandrow {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: "Space Mono", monospace;
    text-transform: uppercase;
    letter-spacing: .16em;
    font-size: clamp(.72rem, 1vw, .88rem);
    color: var(--ink-dim);
    margin-bottom: 2.4rem;
  }

  .rowset {
    display: grid;
    grid-template-columns: repeat(3, minmax(0,1fr));
    gap: 1.1rem;
    margin-top: 1.8rem;
    max-width: 1100px;
  }
  .rowset.two { grid-template-columns: repeat(2, minmax(0,1fr)); max-width: 920px; }
  .ledger-card {
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1.3rem 1.4rem;
    display: flex;
    flex-direction: column;
    gap: .5rem;
  }
  .ledger-card .name {
    font-family: "Space Mono", monospace;
    font-weight: 700;
    font-size: clamp(1rem, 1.3vw, 1.2rem);
    color: var(--ink);
  }
  .ledger-card .desc {
    font-size: clamp(.85rem, 1.05vw, 1rem);
    color: var(--ink-dim);
    line-height: 1.45;
  }

  .agenda {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: .85rem 2.6rem;
    margin-top: 1.6rem;
    max-width: 980px;
  }
  .agenda .item {
    display: flex;
    gap: .9rem;
    align-items: baseline;
  }
  .agenda .n {
    font-family: "Space Mono", monospace;
    font-weight: 700;
    color: var(--cyan);
    min-width: 1.6rem;
  }
  .agenda.labels .n { min-width: 5.6rem; }
  .agenda .t {
    font-size: clamp(1rem, 1.35vw, 1.2rem);
    color: var(--ink);
    line-height: 1.35;
  }

  .keytakes { display:flex; flex-direction:column; gap: 1rem; margin-top: 1.6rem; max-width: 760px; }
  .keytakes .kt { display:flex; gap: 1rem; align-items:flex-start; }
  .keytakes .kt .n { font-family:"Space Mono",monospace; font-weight:700; color: var(--magenta); font-size: 1.1rem; min-width: 1.6rem; }
  .keytakes .kt .t { font-size: clamp(1rem, 1.4vw, 1.2rem); color: var(--ink); line-height:1.4; }
  .keytakes .kt .t span { color: var(--ink-dim); }

  .navhint {
    position: absolute;
    bottom: 2.2vh; left: 9vw;
    font-family: "Space Mono", monospace;
    font-size: .7rem;
    color: var(--ink-faint);
    letter-spacing: .04em;
    z-index: 5;
  }
  .counter {
    position: absolute;
    bottom: 2.2vh; right: 9vw;
    font-family: "Space Mono", monospace;
    font-size: .78rem;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
    z-index: 5;
  }
  .counter .now { color: var(--cyan); }

  .arrows { position:absolute; top:0; bottom:0; width:14%; z-index:6; cursor:pointer; display:flex; align-items:center; }
  .arrows.left { left:0; justify-content:flex-start; padding-left:2vw; }
  .arrows.right { right:0; justify-content:flex-end; padding-right:2vw; }
  .arrows::after {
    content: "";
    width: 2.6rem; height: 2.6rem;
    border-radius: 50%;
    background: var(--bg-panel);
    border: 1px solid var(--line);
    opacity: .8;
    transition: opacity .2s ease, border-color .2s ease, background .2s ease;
    display: flex; align-items: center; justify-content: center;
    font-family: "Space Mono", monospace;
    font-size: 1.3rem;
    color: var(--cyan);
  }
  .arrows.left::after { content: "←"; }
  .arrows.right::after { content: "→"; }
  .arrows:hover::after { opacity: 1; border-color: var(--cyan); background: rgba(47,230,201,0.12); }

  .slide a[target="_blank"] { transition: opacity .15s ease; }
  .slide a[target="_blank"]:hover { text-decoration: underline !important; opacity: .75; }

  :focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    .rail { animation: none; background-position: 0 0; }
  }

  .codebox {
    font-family: "Space Mono", monospace;
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 1.1rem 1.3rem;
    color: var(--cyan);
    font-size: clamp(.82rem, 1.15vw, 1.02rem);
    max-width: 640px;
    margin-top: 1.4rem;
    line-height: 1.8;
    white-space: pre-wrap;
  }

  .speaker {
    margin-top: 2.4rem;
    padding-top: 1.4rem;
    border-top: 1px solid var(--line);
    max-width: 46ch;
  }
  .speaker .name {
    font-family: "Space Mono", monospace;
    font-weight: 700;
    font-size: clamp(1rem, 1.3vw, 1.15rem);
    color: var(--ink);
    margin-bottom: .3rem;
  }
  .speaker .tags {
    font-family: "Space Mono", monospace;
    font-size: .72rem;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--ink-faint);
  }

  .callout {
    margin-top: 1.5rem;
    padding: 1rem 1.3rem;
    border-left: 3px solid var(--cyan);
    background: var(--bg-panel);
    font-size: clamp(1.05rem, 1.5vw, 1.3rem);
    color: var(--ink);
    max-width: 44ch;
    line-height: 1.45;
  }

  .linkrow {
    display: flex;
    gap: 1rem;
    margin-top: 1.8rem;
    flex-wrap: wrap;
  }
  .linkrow .link {
    font-family: "Space Mono", monospace;
    font-size: clamp(.88rem, 1.05vw, 1.02rem);
    color: var(--ink);
    text-decoration: none;
    border: 1px solid var(--line);
    background: var(--bg-panel);
    padding: .6rem 1rem;
    border-radius: 4px;
    transition: border-color .15s ease;
  }
  .linkrow .link:hover, .linkrow .link:focus-visible { border-color: var(--cyan); }
  .linkrow .link span { color: var(--cyan); }

  .flowchart {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .35rem;
    margin-top: 1.4rem;
  }
  .fbox {
    font-family: "Space Mono", monospace;
    font-weight: 700;
    font-size: clamp(.95rem, 1.2vw, 1.1rem);
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: .85rem 1.6rem;
    color: var(--ink);
    min-width: 280px;
    text-align: center;
  }
  .fbox.accent-border { border-color: var(--cyan); color: var(--cyan); }
  .farrow { color: var(--ink-faint); font-size: 1.15rem; line-height: 1; }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Manrope:wght@400;500;700;800&display=swap">
</head>
<body>
<div class="deck">
  <div class="railtrack"><div class="rail" id="rail"></div></div>
  <div id="stage"></div>
  <div class="arrows left" onclick="go(-1)"></div>
  <div class="arrows right" onclick="go(1)"></div>
  <div class="navhint">← / → para avanzar</div>
  <div class="counter"><span class="now" id="cnow">01</span> / <span id="ctotal">00</span></div>

<script>
const slides = [];

function slide(html) {
  slides.push({ html });

slide(`
  <div class="brandrow"><span>NEA Tech</span><span class="accent">Stellar</span></div>

slide(`

slide(`

cd mi-proyecto
npm start</div>

let i = 0;
const stage = document.getElementById("stage");
slides.forEach((s, idx) => {
  const el = document.createElement("div");
  el.className = "slide";
  el.innerHTML = s.html;
  el.dataset.idx = idx;
  stage.appendChild(el);
});
document.getElementById("ctotal").textContent = String(slides.length).padStart(2, "0");

function render() {
  document.querySelectorAll(".slide").forEach((el, idx) => {
    el.classList.toggle("active", idx === i);
  });
  document.getElementById("cnow").textContent = String(i + 1).padStart(2, "0");
  document.getElementById("rail").style.width = (((i + 1) / slides.length) * 100) + "%";
}
function go(d) {
  i = Math.min(slides.length - 1, Math.max(0, i + d));
  render();
}
window.addEventListener("keydown", (e) => {
  if (["ArrowRight", "PageDown", " "].includes(e.key)) { go(1); e.preventDefault(); }
  if (["ArrowLeft", "PageUp"].includes(e.key)) { go(-1); e.preventDefault(); }
});
render();
</script>
</body>
</html>
